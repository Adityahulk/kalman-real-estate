name: Build Apps

# Builds the installable artifacts for every shell that wraps the hosted web app:
#   - Android APK (Capacitor)
#   - iOS build (Capacitor, unsigned — a signed .ipa needs Apple certs; see notes below)
#   - Desktop installers (Electron) for macOS, Windows, Linux
#
# The native projects (android/, ios/) and desktop/node_modules are gitignored, so each job
# regenerates them from config before building — the same way a fresh clone would.
#
# Run it from the Actions tab (workflow_dispatch) or by pushing a version tag (e.g. v0.1.0).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # Shells load the live web app from these origins. Override by setting repo Variables of the
  # same name (Settings → Secrets and variables → Actions → Variables); otherwise the config
  # defaults apply.
  MOBILE_SERVER_URL: ${{ vars.MOBILE_SERVER_URL || 'https://kalman.estate' }}
  DESKTOP_SERVER_URL: ${{ vars.DESKTOP_SERVER_URL || 'https://kalman.estate' }}
  # These shells don't need Puppeteer's bundled Chromium; skip the slow download during install.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # ---------------------------------------------------------------------------
  android:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    # Signing secrets (add in Settings → Secrets and variables → Actions). When present, CI emits a
    # signed release APK + AAB ready for sideloading / Play Store. When absent, it still emits a
    # sideloadable debug APK, so the job is always useful. See docs/RELEASE.md to create these.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate & sync Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build debug APK (always — sideloadable fallback)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK + AAB (unsigned outputs)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign release APK
        id: sign_apk
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign release AAB (for Play Store)
        id: sign_aab
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release (APK + AAB)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-release-signed
          path: |
            android/app/build/outputs/apk/release/*-signed.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  ios:
    name: iOS (unsigned)
    runs-on: macos-14
    # A distributable .ipa requires Apple signing certificates. Without them we can still compile
    # the app to prove the iOS project is valid and produce a .app artifact, so this job is allowed
    # to fail rather than block the release if the toolchain shifts.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate & sync iOS project
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build (simulator — no code signing required)
        # Compiling for the simulator SDK needs no Apple certificates at all, so this reliably
        # proves the iOS project builds. A device .ipa still needs signing certs (see docs/RELEASE.md).
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app artifact
        run: |
          cd ios/App/build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/WIDESTATE-OS-ios-simulator.zip" App.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: WIDESTATE-OS-ios-simulator.zip
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build installers
        # Skip auto code-sign discovery so unsigned CI builds don't hang looking for certs.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix desktop run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # On version tags, attach every built artifact to a GitHub Release so the APK and installers
  # have public, shareable download links (Actions artifacts require a GitHub login; Release
  # assets do not).
  publish-release:
    name: Publish GitHub Release
    # always() so a single failed leg (e.g. one desktop OS) still publishes whatever built; the tag
    # guard keeps it release-only. Individual missing artifacts are tolerated below.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact tree
        run: |
          mkdir -p out
          find dist -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} out/ \;
          ls -la out

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: false
