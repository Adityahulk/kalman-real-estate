<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WIDESTATE OS</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b1220; color: #e8eef7; font-family: -apple-system, system-ui, sans-serif; }
      .wrap { display: flex; min-height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #2a3852; border-top-color: #c9a227; animation: r 0.9s linear infinite; }
      @keyframes r { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Bootstrap loader. Capacitor loads server.url over the top of this; this only shows if the
         remote app is briefly unreachable at cold start. -->
    <div class="wrap">
      <svg width="72" height="72" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#111a2e"/><path d="M128 360V208l128-72 128 72v152h-72v-96h-112v96z" fill="#c9a227"/></svg>
      <div class="spin"></div>
    </div>
  </body>
</html>
