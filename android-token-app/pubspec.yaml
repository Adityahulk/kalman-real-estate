name: kalman_token_app
description: Offline Android app for builder token, plot, EOI, and payment management.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  crypto: ^3.0.3
  csv: ^6.0.0
  drift: ^2.20.3
  excel: ^4.0.6
  file_picker: ^8.1.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  image_picker: ^1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  signature: ^5.5.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_lints: ^4.0.0
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/signatures/
