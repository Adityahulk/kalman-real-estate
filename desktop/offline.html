<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline — WIDESTATE OS</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: -apple-system, Segoe UI, system-ui, sans-serif; background: #0b1220; color: #e8eef7; }
      .wrap { display: flex; min-height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      h1 { font-size: 22px; margin: 18px 0 8px; }
      p { color: #9fb0c8; max-width: 360px; line-height: 1.5; }
      .field { width: min(460px, 100%); margin-top: 14px; text-align: left; }
      label { display: block; margin-bottom: 6px; color: #c5d2e5; font-size: 13px; }
      input { width: 100%; box-sizing: border-box; border: 1px solid #34445f; border-radius: 9px; background: #111a2e; color: #eef4ff; padding: 11px 12px; font: inherit; }
      button { margin-top: 14px; padding: 11px 20px; border-radius: 10px; border: 0; background: #c9a227; color: #0b1220; font-weight: 600; cursor: pointer; }
      .status { min-height: 20px; color: #f6bf73; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg width="72" height="72" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#111a2e"/><path d="M128 360V208l128-72 128 72v152h-72v-96h-112v96z" fill="#c9a227"/></svg>
      <h1>Can't reach WIDESTATE OS</h1>
      <p>The desktop app connects to your WIDESTATE OS server. Check your internet connection, or enter the correct hosted app URL below and reconnect.</p>
      <div class="field">
        <label for="server-url">WIDESTATE OS server URL</label>
        <input id="server-url" type="url" placeholder="https://app.your-company.com" autocomplete="url" />
      </div>
      <div class="status" id="status" role="status"></div>
      <button id="connect">Connect</button>
    </div>
    <script>
      const bridge = window.widestateDesktop;
      const input = document.getElementById("server-url");
      const status = document.getElementById("status");
      const connect = document.getElementById("connect");

      bridge?.getServerUrl?.().then((url) => { input.value = url; }).catch(() => undefined);
      connect.addEventListener("click", async () => {
        const url = input.value.trim();
        if (!bridge?.setServerUrl) { location.reload(); return; }
        status.textContent = "Connecting…";
        connect.disabled = true;
        try {
          await bridge.setServerUrl(url);
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "Could not save this server URL.";
          connect.disabled = false;
        }
      });
    </script>
  </body>
</html>
