services:
  storage-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "mkdir -p /app/storage && chown -R 1001:1001 /app/storage && chmod -R u+rwX,g+rwX /app/storage"]
    volumes:
      - storage_data:/app/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy

  cad-worker:
    build:
      context: .
      dockerfile: Dockerfile.cad-worker
      args:
        ODA_APPIMAGE_URL: ${ODA_APPIMAGE_URL:-}
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      PYTHON_BIN: /usr/bin/python3
      ODA_CONVERTER_BIN: ${ODA_CONVERTER_BIN:-}
      CAD_EXTRACTION_TIMEOUT_MS: ${CAD_EXTRACTION_TIMEOUT_MS:-1800000}
      CAD_PDF_RENDER_SCALE: ${CAD_PDF_RENDER_SCALE:-2}
      CAD_MAX_WORKING_PIXELS: ${CAD_MAX_WORKING_PIXELS:-30000000}
      CAD_MAX_WORKING_DIMENSION: ${CAD_MAX_WORKING_DIMENSION:-6500}
      CAD_CELL_OCR_LIMIT: ${CAD_CELL_OCR_LIMIT:-700}
      CAD_OCR_TIMEOUT_SECONDS: ${CAD_OCR_TIMEOUT_SECONDS:-600}
      CAD_MIN_MEMORY_MB: ${CAD_MIN_MEMORY_MB:-2800}
      CAD_EXTRACTOR_MAX_OUTPUT_MB: ${CAD_EXTRACTOR_MAX_OUTPUT_MB:-100}
      MAX_PDF_CAD_ENTITIES: ${MAX_PDF_CAD_ENTITIES:-25000}
      TESSERACT_BIN: /usr/bin/tesseract
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    volumes:
      - storage_data:/app/storage
    mem_limit: 3g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import fitz, cv2, paddleocr, ezdxf, shapely' && tesseract --version >/dev/null"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s

  document-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: ["npm", "run", "worker:documents"]
    env_file:
      - .env.production
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - storage_data:/app/storage

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: ["npm", "run", "worker:ai"]
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalman_estate}
      POSTGRES_USER: ${POSTGRES_USER:-kalman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalman} -d ${POSTGRES_DB:-kalman_estate}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  storage_data:
