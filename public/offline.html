<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — WIDESTATE OS</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #0b1220; color: #e8eef7; }
      .wrap { display: flex; min-height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #9fb0c8; max-width: 320px; }
      button { margin-top: 20px; padding: 10px 18px; border-radius: 10px; border: 0; background: #c9a227; color: #0b1220; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg width="64" height="64" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#111a2e"/><path d="M128 360V208l128-72 128 72v152h-72v-96h-112v96z" fill="#c9a227"/></svg>
      <h1>You're offline</h1>
      <p>WIDESTATE OS needs a connection to load your workspace. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
